name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          # Pages가 아직 켜져 있지 않으면 워크플로가 직접 활성화합니다.
          enablement: true

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          # 빌드 단계가 없는 정적 사이트라 저장소 루트를 그대로 올립니다.
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
