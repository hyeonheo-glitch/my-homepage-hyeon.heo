<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>허현의 홈페이지</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: #f7f7f5;
      color: #1a1a1a;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #today {
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #6b6b6b;
    }
  </style>
</head>
<body>
  <h1>안녕하세요, 허현입니다</h1>
  <p id="today"></p>

  <script>
    const now = new Date();
    document.getElementById("today").textContent = now.toLocaleDateString("ko-KR", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    });
  </script>
</body>
</html>
